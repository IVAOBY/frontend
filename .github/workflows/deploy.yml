# Имя вашего Workflow
name: 🚀 CI/CD Pipeline

# Триггеры для запуска
on:
  # 1. Автоматический запуск при пуше в указанные ветки
  push:
    branches:
      - main      # Для production
      - develop   # Для staging

  # 2. Ручной запуск из интерфейса GitHub Actions
  workflow_dispatch:
    inputs:
      environment:
        description: 'Выберите среду для развертывания'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Staging
          - Production

jobs:
  # --- ЗАДАЧА 1: ПРОВЕРКА КОДА ---
  lint-and-format:
    name: 🧼 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      # Настройка Node.js с автоматической аутентификацией
      - name: 🟢 Setup Node.js with NPM Auth
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          # Указываем, что нужно аутентифицироваться в реестре GitHub
          registry-url: 'https://npm.pkg.github.com'
          # Указываем область видимости для пакетов
          scope: '@ivaoby'

      - name: 📥 Install dependencies
        # NODE_AUTH_TOKEN будет автоматически использован yarn/npm
        run: yarn
        env:
          # Используем персональный токен для доступа к пакетам в других репозиториях
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Устанавливаем недостающие зависимости, чтобы исправить ошибки
      - name: ➕ Fix Peer Dependencies
        run: yarn add prettier-plugin-tailwindcss eslint@^9.0.0 --dev

      - name: ✨ Format and Lint code
        run: |
          yarn format
          yarn lint

  # --- ЗАДАЧА 2: СБОРКА И РАЗВЕРТЫВАНИЕ ---
  build-and-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      # Настройка Node.js с автоматической аутентификацией
      - name: 🟢 Setup Node.js with NPM Auth
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          # Указываем, что нужно аутентифицироваться в реестре GitHub
          registry-url: 'https://npm.pkg.github.com'
          # Указываем область видимости для пакетов
          scope: '@ivaoby'

      - name: 📥 Install dependencies
        run: yarn
        env:
          # Используем персональный токен для доступа к пакетам в других репозиториях
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Устанавливаем недостающую зависимость, которая может быть нужна для сборки
      - name: ➕ Install missing peer dependency
        run: yarn add prettier-plugin-tailwindcss --dev

      - name: 🛠️ Build project
        run: yarn build

      # Определение пути развертывания
      - name: 🗺️ Determine deployment path
        id: set_path
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "path=${{ secrets.PROD_PATH }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "Production" ]]; then
            echo "path=${{ secrets.PROD_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "path=${{ secrets.STAGE_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy to server
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "dist/"
          REMOTE_USER: ${{ secrets.USERNAME }}
          REMOTE_HOST: ${{ secrets.HOST }}
          # Используем путь, определенный на предыдущем шаге
          TARGET: ${{ steps.set_path.outputs.path }}
          RYSNC_OPTIONS: --delete
