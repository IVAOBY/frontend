name: Release 🌐️
on:
  workflow_call:
jobs:
  release-project:
    name: Release 🌐
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code 🚚
        uses: actions/checkout@v3

      - name: Git Version 🆔
        uses: codacy/git-version@2.7.1
        with:
          tool-version: latest
          release-branch: main
          dev-branch: dev

      - name: Create Release 🌐️
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

      - name: Archive Code 🗜
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'frontend.zip'
          path: 'dist'

      - name: Upload Release 🌐️
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./frontend.zip
          asset_name: frontend.zip
          asset_content_type: application/zip

  release-stage:
    name: Stage Release 🌐
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code 🚚
        uses: actions/checkout@v3

      - name: Git Version 🆔
        uses: codacy/git-version@2.7.1
        with:
          tool-version: latest
          release-branch: main
          dev-branch: dev

      - name: Create Release 🌐️
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Stage-Release ${{ steps.version.outputs.version }}
          body: |
            Stage-Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: true

      - name: Archive Code 🗜
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'frontend-stage.zip'
          path: 'dist'

      - name: Upload Release 🌐️
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./frontend-stage.zip
          asset_name: frontend-stage.zip
          asset_content_type: application/zip
