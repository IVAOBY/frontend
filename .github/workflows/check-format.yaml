name: Code Formatting 🛠️
on:
  workflow_call:
jobs:
  yarn-format:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code 🚚
        uses: actions/checkout@v3

      - name: Set up Node.js 👾
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies ⚙️
        run: |
          yarn install --force

      - name: Format code ✨
        if: ${{ hashFiles('**/.prettierrc') != '' }}
        run: |
          yarn format

      - name: Lint code ⚙️
        if: ${{ hashFiles('**/.eslintrc') != '' }}
        run: |
          yarn lint --fix
