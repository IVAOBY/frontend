on:
  push:
  pull_request:

name: 🚀 Code Lint&Format
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: 👌 Format and Lint
        run: |
          yarn install --force
          yarn format
          yarn lint --fix

