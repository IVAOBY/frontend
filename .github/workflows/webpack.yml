on: 
 push:
  branches: main
  pull_request:
    branches: main

name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: Use Node.js 16
      uses: actions/setup-node@v2
      with:
        node-version: '16'
      
    - name: 🔨 Build Project
      run: |
        npm install --force --legacy-peer-deps
        CI=false npm run build

    - name: 📂 Sync files
      uses: sand4rt/ftp-deployer@v1.7
      with:
        sftp: false
        host: ${{ secrets.PRODUCTION_FTP_HOST }}
        port: 21
        username: ${{ secrets.PRODUCTION_FTP_USER }}
        password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
        local_folder: dist
        remote_folder: ./
        cleanup: false
        exclude: '[]'
        passive: true
