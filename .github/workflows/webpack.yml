on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: Use Node.js 16
      uses: actions/setup-node@v2
      with:
        node-version: '16'
      
    - name: 🔨 Build Project
      run: |
        npm install --force --legacy-peer-deps
        CI=false npm run build

    - name: 📂 Sync files
      uses: sand4rt/ftp-deployer@v1.7
      with:
        sftp: false # optional
        host: ${{ secrets.PRODUCTION_FTP_HOST }} # e.g. ftp.host.com or sftp.host.com (without ftp:// or ftps://)
        port: 21 # optional, default is: 21
        username: ${{ secrets.PRODUCTION_FTP_USER }} # FTP username
        password: ${{ secrets.PRODUCTION_FTP_PASSWORD }} # FTP password
        local_folder: build
        remote_folder: ./
 # optional, local path, default is: dist
        cleanup: true # optional, remove existing files inside FTP remote folder
        exclude: '[]' # optional, e.g. '['node_modules/**', '.git/**', '*.env']'
        passive: true # optional
