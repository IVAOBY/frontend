# Имя вашего Workflow
name: 🚀 CI/CD Pipeline

# Триггеры для запуска
on:
  # 1. Автоматический запуск при пуше в указанные ветки
  push:
    branches:
      - main      # Для production
      - dev

  # 2. Ручной запуск из интерфейса GitHub Actions
  workflow_dispatch:
    # Добавляем поле для выбора, куда разворачивать
    inputs:
      environment:
        description: 'Выберите среду для развертывания'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Staging
          - Production

jobs:
  # --- ЗАДАЧА 1: ПРОВЕРКА КОДА ---
  lint-and-format:
    name: 🧼 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # Новый шаг для аутентификации в GitHub Packages
      - name: 🔐 Setup .npmrc for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" > .npmrc
          echo "@ivaoby:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "@ivaoaero:registry=https://npm.pkg.github.com/" >> .npmrc

      - name: 📥 Install dependencies
        run: yarn

      - name: ✨ Format and Lint code
        run: |
          yarn format
          yarn lint

  # --- ЗАДАЧА 2: СБОРКА И РАЗВЕРТЫВАНИЕ ---
  build-and-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # Новый шаг для аутентификации в GitHub Packages
      - name: 🔐 Setup .npmrc for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" > .npmrc
          echo "@ivaoby:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "@ivaoaero:registry=https://npm.pkg.github.com/" >> .npmrc

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🛠️ Build project
        run: yarn build

      # Новый шаг для определения пути развертывания
      - name: 🗺️ Determine deployment path
        id: set_path
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "path=${{ secrets.PROD_PATH }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "Production" ]]; then
            echo "path=${{ secrets.PROD_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "path=${{ secrets.STAGE_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy to server
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "dist/"
          REMOTE_USER: ${{ secrets.USERNAME }}
          REMOTE_HOST: ${{ secrets.HOST }}
          # Используем путь, определенный на предыдущем шаге
          TARGET: ${{ steps.set_path.outputs.path }}
          RYSNC_OPTIONS: --delete
