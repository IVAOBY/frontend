on:
  push:
  pull_request:

name: 🚀 Lint and Format
jobs:
  lint-format:
    name: 🎉 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🟢 Use Node.js 20
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: 🔐 Auth with token
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.AUTH_TOKEN }}
          @ivaoby:registry=https://npm.pkg.github.com/
          @ivaoaero:registry=https://npm.pkg.github.com/" > ~/.npmrc

      - name: 📥 Install dependencies
        run: yarn --force --legacy-peer-deps

      - name: ✨ Format code
        run: yarn format

      - name: 🔍 Lint code
        run: yarn lint --fix

      - name: 📤 Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: lint-format-logs
          path: |
            **/.eslintcache
