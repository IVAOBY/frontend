on:
 push:
  branches:

name: 🚀 Deploy website on push
jobs:
  check-format:
    name: Format 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: write

  web-deploy:
    name: Build 🎉
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: Set up Node.js 👾
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: 🔨 Build Project
      run: |
        yarn install --force
        CI=false npm run build

    - name: 📂 Sync files
      uses: sand4rt/ftp-deployer@v1.7
      if: github.ref_name == 'main'
      with:
        sftp: false
        host: ${{ secrets.PRODUCTION_FTP_HOST }}
        port: 21
        username: ${{ secrets.PRODUCTION_FTP_USER }}
        password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
        local_folder: dist
        remote_folder: ./by.ivao.systems/htdocs
        cleanup: false
        exclude: '[]'
        passive: true
