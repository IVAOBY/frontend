name: Deploy to Plesk Stage

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn

      - name: 🔐 Auth with token
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.AUTH_TOKEN }}
          @ivaoby:registry=https://npm.pkg.github.com/
          @ivao:registry=https://npm.pkg.github.com/" > ~/.npmrc

      - name: Build application
        run: yarn build

      - name: Deploy to Plesk
        uses: celleb/plesk-deployer@v1.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ftp-username: ${{ vars.FTP_USERNAME }}
          ftp-server: ${{ vars.FTP_SERVER }}
          files-to-copy: "./dist ./package.json ./yarn.lock"
          remote-dir: "./httpdocs"
          node-version: 20
          package-manager: yarn
          npm-install: true
          restart: true
          clean-remote-dir: true
