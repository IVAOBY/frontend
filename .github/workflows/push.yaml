on:
 push:
  branches:

name: Push Action 🚀
jobs:
  check-format:
    name: Format 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: write

  build-project:
    name: Build 🎉
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:

    - name: Get latest code 🚚
      uses: actions/checkout@v3

    - name: Set up Node.js 👾
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Build Project 🔨
      run: |
        yarn install --force
        CI=false yarn build

  ftp-deploy:
    name: Sync files 📂
    if: github.ref_name == 'main'
    uses: ./.github/workflows/web-deploy.yaml
    permissions: write-all
