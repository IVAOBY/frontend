name: 🐛 Bug report
description: Create a report to help us improve
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.

        This issue tracker is for bugs and issues found within the IVAO Belarus main site frontend project.
        Please fill in as much of the following form as you're able.
  - type: dropdown
    attributes:
      label: Branch
      description: Choose a branch where the bug occurs
      options:
        - main
        - dev
        - other
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      description: Please select the browser(s) where you have encountered the bug.
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
  - type: textarea
    attributes:
      label: What steps will reproduce the bug?
      description: Enter details about your bug, or a simple code snippet that can cause it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How often does it reproduce? Is there a required condition?
      description: Describe how frequently the bug occurs and whether there are specific conditions where it always happens.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior? Why is that the expected behavior?
      description: Describe what you would expect to happen when performing the steps above.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What do you see instead?
      description: Describe the actual behavior when you perform the steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional information
      description: Provide any additional information, screenshots, or context relevant to the bug report here.
